name: Windows Wao installer
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version, for example 1.0.1'
        required: true
        default: '1.0.0'
  push:
    tags: ['wao-v*']
permissions:
  contents: read
concurrency:
  group: wao-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.21.1'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@10.33.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install speech download tool
        run: python -m pip install 'huggingface_hub>=1,<2'
      - name: Set installer version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^wao-v', '' } else { $env:INPUT_VERSION }
          ./scripts/Set-WaoReleaseVersion.ps1 -Version $version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Regression tests
        shell: pwsh
        run: |
          $tests = Get-Content scripts/wao-release-tests.json -Raw | ConvertFrom-Json
          pnpm exec vitest run @tests --pool=threads --maxWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle verified Whisper dictation
        shell: pwsh
        run: ./scripts/setup-local-speech.ps1
      - run: pnpm run build
      - name: Build installer and verify packaged speech
        shell: pwsh
        run: ./scripts/Build-WaoInstaller.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Wao-Windows-x64
          path: |
            release/build/Wao-*-Setup.exe
            release/build/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
  release:
    if: startsWith(github.ref, 'refs/tags/wao-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Wao-Windows-x64
          path: installer
      - name: Attach installer to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_TITLE="Wao ${RELEASE_TAG#wao-v}"
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TITLE" --notes "Windows x64 installer with local Whisper dictation included. Add your own AI endpoint after installation. Kokoro speech synthesis and document embeddings are optional separate services. Unsigned build; verify SHA256SUMS.txt. See README for setup and Help chat instructions." installer/*
