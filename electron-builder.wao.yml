extends: ./electron-builder.yml
productName: Wao
# Wao's own identity: the NSIS install GUID derives from this, so the
# installer no longer matches the old Chatbox Lite registry entry and its
# Programs\Chatbox Lite path. The profile was already migrated to
# %APPDATA%\Wao by the main-process bootstrap; this finishes the rename.
appId: local.wao
publish: null
extraMetadata:
  author:
    name: Wao Contributors
    email: 4097153+nouone@users.noreply.github.com
    url: https://github.com/nouone
compression: store
nsis:
  shortcutName: Wao
  uninstallDisplayName: Wao

win:
  artifactName: Wao-${version}-${arch}-Setup.${ext}
